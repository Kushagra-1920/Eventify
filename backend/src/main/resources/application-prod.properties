# Production Environment (Railway)

# Database Configuration (Strictly from Env)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
# Use 'update' for initial Railway deploy, or 'validate' if DB is already fully seeded
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Secrets (Strictly from Env)
jwt.secret=${JWT_SECRET}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# OAuth (Strictly from Env)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# CORS & Frontend URL
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${ALLOWED_ORIGINS}
